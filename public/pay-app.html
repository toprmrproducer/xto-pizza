<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Pay | XTO Pizza</title>
<style>
*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;background:#12100a;font-family:Inter,system-ui,sans-serif;color:#fff6e9;padding:24px;text-align:center}
.spin{width:44px;height:44px;border:4px solid #3a3226;border-top-color:#f0731d;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
p{color:#bfae98;line-height:1.6;margin-top:6px}
</style>
</head>
<body>
<div><div class="spin"></div><h1 style="font-size:1.2rem">Opening secure payment...</h1><p id="m">Please wait.</p></div>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search), s = q.get('s'), env = q.get('env') === 'sandbox' ? 'sandbox' : 'production';
  if (!s) { document.getElementById('m').textContent = 'Missing payment session.'; return; }
  try {
    var cf = window.Cashfree({ mode: env });
    cf.checkout({ paymentSessionId: s, redirectTarget: '_self' });
  } catch (e) { document.getElementById('m').textContent = 'Could not open payment. Go back and try again.'; }
})();
</script>
</body>
</html>
